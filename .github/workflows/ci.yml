name: CI

on:
  pull_request:
    # "**", а не "*": одна звёздочка не матчит слеш, и PR в ветки вида
    # claude/… (stacked PR) уходили без CI
    branches: ["**"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Build
        run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: bun lint && bun lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: bun format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: bun typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      # Эти пакеты отдают код из dist — без сборки тесты их не находят
      - name: Build packages used by tests
        run: bun run build --filter=@stariva/config --filter=@stariva/storage --filter=@stariva/emails

      - name: Test
        run: bun test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Та же версия, что в docker-compose.yml
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      # Эти пакеты отдают код из dist — без сборки тесты их не находят
      - name: Build packages used by tests
        run: bun run build --filter=@stariva/config --filter=@stariva/storage --filter=@stariva/emails

      # Каждый набор получает свою базу с миграциями; пропуск теста — провал
      - name: Integration tests
        run: bun run test:integration
        env:
          TEST_POSTGRES_URL: postgres://postgres:password@127.0.0.1:5432/postgres
          # С CI=true env.ts пропускает валидацию, и дефолт APP_URL из схемы
          # не подставляется — ссылки в письмах строить не из чего
          APP_URL: http://localhost:3000

