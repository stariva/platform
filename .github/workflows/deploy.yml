name: Deploy

# Runs on push to main. Applies pending DB migrations, builds the images,
# pushes them to GHCR, then rolls them out on the k3s cluster with kubectl.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-stariva
  cancel-in-progress: false

jobs:
  # Миграции накатываются до выкатки кода: поды стартуют уже на новой схеме.
  # Повторный запуск без новых файлов ничего не делает, поэтому гоняем на каждый
  # деплой. Миграции должны быть совместимы со старым кодом (сначала добавляем,
  # потом, отдельным деплоем, удаляем): пока идёт rolling update, старый под
  # ещё обслуживает запросы.
  migrate:
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.sha.outputs.sha }}
          build-args: |
            DEPLOYMENT_ID=${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          # KUBE_CONFIG may be either the raw kubeconfig YAML or its base64 encoding
          if echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config 2>/dev/null && grep -q "apiVersion" ~/.kube/config; then
            echo "KUBE_CONFIG decoded from base64"
          else
            echo "$KUBE_CONFIG" > ~/.kube/config
            echo "KUBE_CONFIG used as raw YAML"
          fi
          chmod 600 ~/.kube/config

      - name: Roll out new image on k3s
        run: |
          kubectl set image deployment/stariva stariva=ghcr.io/stariva/platform:${{ needs.build-and-push.outputs.sha }} -n stariva
          # Старый под обслуживает трафик, пока новый не прошёл readiness (maxUnavailable: 0),
          # так что при неудаче достаточно вернуть предыдущую ревизию
          if ! kubectl rollout status deployment/stariva -n stariva --timeout=300s; then
            kubectl get pods -n stariva -l app=stariva
            kubectl describe pods -n stariva -l app=stariva | tail -n 60
            kubectl rollout undo deployment/stariva -n stariva
            kubectl rollout status deployment/stariva -n stariva --timeout=120s
            echo "::error::Выкатка stariva не прошла, возвращена предыдущая ревизия"
            exit 1
          fi

  # ─── Админка (apps/app → app.stariva.ru) ───────────────────────────────────
  build-and-push-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-app:latest
            ghcr.io/${{ github.repository }}-app:${{ steps.sha.outputs.sha }}
          build-args: |
            DEPLOYMENT_ID=${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  deploy-app:
    needs: [build-and-push-app, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          if echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config 2>/dev/null && grep -q "apiVersion" ~/.kube/config; then
            echo "KUBE_CONFIG decoded from base64"
          else
            echo "$KUBE_CONFIG" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Roll out new image on k3s
        run: |
          # Деплоймент создаётся один раз руками: stariva/infra, k3s/31-app.stariva.ru.yaml
          # Пропускаем только отсутствие Deployment; ошибки доступа к API валят шаг
          deployment="$(kubectl get deployment/stariva-app -n stariva --ignore-not-found -o name)" || exit 1
          if [ -z "$deployment" ]; then
            echo "::notice::deployment/stariva-app ещё не создан — пропускаю выкатку админки"
            exit 0
          fi
          kubectl set image deployment/stariva-app stariva-app=ghcr.io/stariva/platform-app:${{ needs.build-and-push-app.outputs.sha }} -n stariva
          if ! kubectl rollout status deployment/stariva-app -n stariva --timeout=300s; then
            kubectl get pods -n stariva -l app=stariva-app
            kubectl describe pods -n stariva -l app=stariva-app | tail -n 60
            kubectl rollout undo deployment/stariva-app -n stariva
            kubectl rollout status deployment/stariva-app -n stariva --timeout=120s
            echo "::error::Выкатка stariva-app не прошла, возвращена предыдущая ревизия"
            exit 1
          fi

  # ─── Воркер фоновых заданий (apps/jobs, Hatchet) ───────────────────────────
  build-and-push-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/jobs/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-jobs:latest
            ghcr.io/${{ github.repository }}-jobs:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,mode=max,scope=jobs

  deploy-jobs:
    needs: [build-and-push-jobs, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          if echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config 2>/dev/null && grep -q "apiVersion" ~/.kube/config; then
            echo "KUBE_CONFIG decoded from base64"
          else
            echo "$KUBE_CONFIG" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Roll out new image on k3s
        run: |
          # Деплоймент создаётся один раз руками в stariva/infra (stariva-jobs, контейнер stariva-jobs).
          # Пропускаем только отсутствие Deployment; ошибки доступа к API валят шаг
          deployment="$(kubectl get deployment/stariva-jobs -n stariva --ignore-not-found -o name)" || exit 1
          if [ -z "$deployment" ]; then
            echo "::notice::deployment/stariva-jobs ещё не создан — пропускаю выкатку воркера"
            exit 0
          fi
          kubectl set image deployment/stariva-jobs stariva-jobs=ghcr.io/stariva/platform-jobs:${{ needs.build-and-push-jobs.outputs.sha }} -n stariva
          # Старый воркер до 120 с дожидается текущих заданий, а rollout status ждёт его выхода
          if ! kubectl rollout status deployment/stariva-jobs -n stariva --timeout=240s; then
            kubectl get pods -n stariva -l app=stariva-jobs
            kubectl describe pods -n stariva -l app=stariva-jobs | tail -n 60
            kubectl rollout undo deployment/stariva-jobs -n stariva
            kubectl rollout status deployment/stariva-jobs -n stariva --timeout=240s
            echo "::error::Выкатка stariva-jobs не прошла, возвращена предыдущая ревизия"
            exit 1
          fi
