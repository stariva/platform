name: Mobile

# Проверяет, что оболочку приложения вообще можно собрать: debug-APK на Linux и
# симуляторную сборку на macOS (без подписи). Ловит поломки Gradle/Xcode и
# плагинов раньше, чем до них дойдёт релиз.
on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/web-api/src/contract/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      # Плагины Capacitor 8 собираются под Java 21
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Sync web bundle
        working-directory: apps/mobile
        run: bun run cap:sync

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Sync web bundle
        working-directory: apps/mobile
        run: bun run cap:sync

      - name: Build for simulator
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
