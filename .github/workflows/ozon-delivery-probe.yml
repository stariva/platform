name: Ozon Delivery probe

# Разовая диагностика ключей Ozon Доставки для бизнеса — изнутри прод-пода.
# Запускается пушем этой ветки (workflow_dispatch требует файл на main) и
# вручную по кнопке. Ничего не деплоит и в код приложения не пишет: скрипт
# читает переменные окружения пода и делает несколько обменов ключей +
# дешёвые запросы API. Печатает только коды ответов, тайминги, заголовки и
# клеймы токена (scope, exp) — секреты и сами токены в вывод не попадают.
on:
  push:
    branches: [chore/ozon-delivery-probe]
  workflow_dispatch:

concurrency:
  group: ozon-delivery-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          # KUBE_CONFIG may be either the raw kubeconfig YAML or its base64 encoding
          if echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config 2>/dev/null && grep -q "apiVersion" ~/.kube/config; then
            echo "KUBE_CONFIG decoded from base64"
          else
            echo "$KUBE_CONFIG" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Pod list
        run: kubectl get pods -n stariva -l app=stariva

      - name: Write probe script
        run: |
          cat > ozon-probe.ts <<'EOF'
          const clientId = process.env.OZON_BUSINESS_DELIVERY_CLIENT_ID;
          const clientSecret = process.env.OZON_BUSINESS_DELIVERY_CLIENT_SECRET;
          if (!clientId || !clientSecret) {
            console.log("KEYS: OZON_BUSINESS_DELIVERY_CLIENT_ID/SECRET не заданы в поде — проверять нечего");
            process.exit(0);
          }
          console.log(`KEYS: заданы (client_id длина ${clientId.length}, префикс ${clientId.slice(0, 4)}…)`);

          const SCOPES = [
            "delivery-api.delivery",
            "delivery-api.delivery-point",
            "delivery-api.order",
            "delivery-api.posting",
          ];
          const TOKEN_URL = "https://xapi.ozon.ru/oauth/token";
          const API = "https://api-delivery.ozon.ru/v1/delivery/check-client";

          async function post(url, headers, body) {
            let target = url;
            let current = headers;
            for (let hop = 0; hop < 3; hop++) {
              const res = await fetch(target, {
                method: "POST",
                headers: current,
                body,
                redirect: "manual",
                signal: AbortSignal.timeout(15_000),
              });
              if (![301, 302, 303, 307, 308].includes(res.status)) return res;
              const cookie = res.headers
                .getSetCookie()
                .map((line) => line.split(";")[0])
                .join("; ");
              const location = res.headers.get("location");
              if (!location) return res;
              target = new URL(location, target).toString();
              if (cookie) current = { ...current, Cookie: cookie };
              await res.body?.cancel().catch(() => {});
            }
            throw new Error("слишком много редиректов");
          }

          function showHeaders(res) {
            const picked = {};
            for (const [name, value] of res.headers) {
              if (name.startsWith("x-") || name === "www-authenticate" || name === "server") {
                picked[name] = value.slice(0, 200);
              }
            }
            return picked;
          }

          // Разбираем клеймы JWT: печатаем только scope/exp/aud — сам токен нет
          function describeToken(token) {
            const parts = token.split(".");
            if (parts.length !== 3) return "не JWT";
            try {
              const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
              const nowSec = Math.floor(Date.now() / 1000);
              const scope = Array.isArray(claims.scope) ? claims.scope.join(" ") : claims.scope;
              const life = typeof claims.exp === "number" ? `exp через ${claims.exp - nowSec} с` : "exp нет";
              return `scope=[${scope}], ${life}`;
            } catch (error) {
              return `клеймы не разбираются: ${error.message}`;
            }
          }

          async function fetchToken(label, scopeValue) {
            const payload = {
              client_id: clientId,
              client_secret: clientSecret,
              grant_type: "client_credentials",
            };
            if (scopeValue !== null) payload.scope = scopeValue;
            const startedAt = Date.now();
            const res = await post(
              TOKEN_URL,
              { "Content-Type": "application/json" },
              JSON.stringify(payload),
            );
            const body = await res.text();
            console.log(`\n[OAuth ${label}] HTTP ${res.status} за ${Date.now() - startedAt} мс`);
            let token = null;
            try {
              const data = JSON.parse(body);
              token = data.access_token ?? null;
              if (token) {
                console.log(`  ${describeToken(token)}`);
              } else {
                console.log(`  тело ответа: ${body.slice(0, 300)}`);
              }
            } catch {
              console.log(`  тело ответа (не JSON): ${body.slice(0, 300)}`);
            }
            return token;
          }

          async function checkClient(label, token) {
            const startedAt = Date.now();
            const res = await post(
              API,
              { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              JSON.stringify({ phone_number: "+79000000000" }),
            );
            const body = await res.text();
            console.log(`[check-client ${label}] HTTP ${res.status} за ${Date.now() - startedAt} мс`);
            if (res.status !== 200) {
              console.log(`  заголовки: ${JSON.stringify(showHeaders(res))}`);
              console.log(`  тело: ${body.slice(0, 200)}`);
            }
            return res.status;
          }

          const statuses = {};
          const runs = [
            ["массивом, как шлёт код сейчас", SCOPES],
            ["строкой через пробел, как требует OAuth", SCOPES.join(" ")],
            ["без scope вовсе, что выдаёт по умолчанию", null],
          ];
          for (const [label, scopeValue] of runs) {
            const token = await fetchToken(label, scopeValue);
            if (token) statuses[label] = await checkClient(label, token);
          }

          console.log("\n=== Вердикт ===");
          const asString = statuses["строкой через пробел, как требует OAuth"];
          const asArray = statuses["массивом, как шлёт код сейчас"];
          if (asString === 200) {
            console.log("КОД ВИНОВАТ: scope строкой через пробел работает, массив Ozon игнорирует. Нужно поправить клиент: SCOPES.join(\" \").");
          } else if (asString === 401 && asArray === 401) {
            console.log("НЕ В КОДЕ: даже строковый scope не даёт доступ к Delivery API — у приложения в кабинете нет действующих delivery-скоупов, несмотря на галочки.");
          } else {
            console.log("Смесь результатов — смотрите статусы выше.");
          }
          console.log(JSON.stringify(statuses));
          EOF

      - name: Run probe inside the prod pod
        run: |
          kubectl exec -i deployment/stariva -n stariva -- sh -c 'cat > /tmp/ozon-probe.ts && bun /tmp/ozon-probe.ts' < ozon-probe.ts
