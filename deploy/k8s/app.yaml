# Админка Stariva (apps/app) на app.stariva.ru — k3s, namespace stariva.
# Повторяет схему сайта (deployment/stariva): тот же секрет stariva-app-secrets,
# та же база, Traefik IngressRoute с сертификатом Let's Encrypt (resolver le).
#
# Перед первым применением добавьте в секрет stariva-app-secrets:
#   ADMIN_EMAILS          — кто может входить в админку (через запятую)
#   REVALIDATE_SECRET     — общий с сайтом, ≥ 32 символов (сайт читает его же)
#   AWS_S3_ENDPOINT       — https://storage.yandexcloud.net
#   AWS_S3_PUBLIC_BUCKET  — публичный бакет для фото каталога
#
#   kubectl apply -f deploy/k8s/app.yaml
#
# Дальше образ обновляет .github/workflows/deploy.yml при пуше в main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stariva-app
  namespace: stariva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stariva-app
  template:
    metadata:
      labels:
        app: stariva-app
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: stariva-app
          image: ghcr.io/stariva/platform-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: stariva-app-secrets
          # env перекрывает одноимённые ключи из секрета сайта
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: https://app.stariva.ru
            - name: BETTER_AUTH_URL
              value: https://app.stariva.ru
            - name: STOREFRONT_URL
              value: https://stariva.ru
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_PASSWORD
            - name: POSTGRES_URL
              value: postgresql://stariva:$(DB_PASSWORD)@postgres.postgres.svc.cluster.local:5432/stariva
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stariva-app
  namespace: stariva
spec:
  selector:
    app: stariva-app
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stariva-app
  namespace: stariva
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`app.stariva.ru`)
      services:
        - name: stariva-app
          port: 80
  tls:
    certResolver: le
    domains:
      - main: app.stariva.ru
