# Проектный конфиг Codex. Работает, когда проект помечен как trusted.
# Для глобального конфига: %USERPROFILE%\.codex\config.toml (секции можно перенести туда).

# model = "..."                      # раскомментируйте и укажите модель, которую рекомендует ваша версия Codex
approval_policy = "on-request"       # спрашивает перед рискованными действиями
sandbox_mode = "workspace-write"     # пишет только в папку проекта

[sandbox_workspace_write]
network_access = true                # нужно для npm install и чтения документации

# ---------- MCP-серверы ----------
# Нативный Windows: npx запускаем через cmd /c.
# Если работаете в WSL — замените на command = "npx", args = ["-y", "..."]

# Актуальная документация библиотек (React, Capacitor, Tailwind, TanStack…)
[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]

# Браузер: открывает приложение в мобильном вьюпорте, делает скриншоты, кликает
[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]

